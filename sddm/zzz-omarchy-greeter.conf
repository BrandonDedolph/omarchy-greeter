# Installed by omarchy-greeter. Sorts after Omarchy's own login config so
# this theme wins; remove the package to go back to the stock screen.
[Theme]
Current=omarchy-greeter

[General]
# The theme reads each user's published look and shares the selected user
# between monitors through small files.
GreeterEnvironment=QML_XHR_ALLOW_FILE_READ=1,QML_XHR_ALLOW_FILE_WRITE=1

[Wayland]
# Omarchy's greeter compositor config, plus keyboard focus kept on the
# primary monitor from /etc/omarchy-greeter.conf. Started through
# greeter-compositor, which works around a Hyprland crash on exit.
CompositorCommand=/usr/lib/omarchy-greeter/greeter-compositor --config /usr/share/omarchy-greeter/hyprland.lua
