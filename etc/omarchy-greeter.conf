# omarchy-greeter settings (machine-wide). Easiest to change from the
# Omarchy menu (Setup > Login & Lock) or with `omarchy-greeter`, which also
# lets you pick the monitor you are looking at: omarchy-greeter monitor focused

# The monitor that shows the login screen and the lock screen; every other
# monitor stays black while they are up. A connector name from
# `hyprctl monitors` (e.g. DP-1, HDMI-A-1, eDP-1). Empty: every monitor. If
# this monitor is not connected, every monitor is used, so you can never be
# left without a login form.
primary=

# After you type the disk password at boot, let the first login skip the
# account password, for these accounts only (comma-separated; one login,
# within 10 minutes of boot, and only when the disk really needed a typed
# password). no: always ask. Anyone who knows the disk password can use it,
# so name only accounts whose owners are the ones who know it.
#   omarchy-greeter boot-pass on    (adds your account)
boot_unlock=no

# Video backgrounds on the login screen. The login screen receives every
# account's password, so by default it shows a still of a video background
# instead of decoding another account's video file. yes: play them.
video=no
