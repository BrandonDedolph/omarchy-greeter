# omarchy-greeter settings (machine-wide).

# The monitor that shows the login screen and the lock screen. Every other
# monitor stays black while they are up. Use a connector name from
# `hyprctl monitors` (e.g. DP-2). Leave empty to use every monitor. If this
# monitor is not connected, every monitor is used, so you can't be locked out.
primary=DP-2

# After you type the disk password at boot, let the first login on the login
# screen skip the account password (one login, within 10 minutes of boot).
# Set to no to always ask for the account password.
boot_unlock=yes
